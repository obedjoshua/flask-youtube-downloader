<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Media Workspace</title>
    <style>
        /* Theme Palettes: Bluish Dark Gray & Off-Cream (Inverted for Light Mode) */
        :root {
            --bg-canvas: #121420;
            --bg-panel: #1a1d2e;
            --bg-input: #161825;
            --border-color: #2e334d;
            --accent-blue: #3b82f6;
            --accent-hover: #2563eb;
            --accent-success: #10b981;
            --text-main: #f4f1ea;       /* Off-cream text for dark mode */
            --text-muted: #9ba1b5;
        }

        [data-theme="light"] {
            --bg-canvas: #f4f1ea;       /* Off-cream canvas for light mode */
            --bg-panel: #e6e2d6;
            --bg-input: #ffffff;
            --border-color: #cbd1c5;
            --accent-blue: #2563eb;
            --accent-hover: #1d4ed8;
            --accent-success: #059669;
            --text-main: #161825;       /* Bluish dark gray text for light mode */
            --text-muted: #5c637a;
        }

        * {
            box-sizing: border-box;
            border-radius: 0 !important; /* Enforces strict mitered sharp edges */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            background-color: var(--bg-canvas); color: var(--text-main); margin: 0; padding: 2rem;
            display: flex; flex-direction: column; align-items: center;
            transition: background-color 0.2s, color 0.2s;
        }

        .container { width: 100%; max-width: 960px; }

        /* Workspace Header */
        .workspace-header {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--bg-panel); border: 1px solid var(--border-color);
            padding: 1rem 1.5rem; margin-bottom: 1.5rem;
        }
        .workspace-header h1 { font-size: 1.2rem; margin: 0; font-weight: 600; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; }

        /* Toolbar Navigation Tabs & Theme Toggle */
        .header-actions { display: flex; align-items: center; gap: 12px; }
        .nav-tabs { display: flex; gap: 6px; }
        .tab-btn, .theme-toggle-btn { 
            padding: 8px 16px; font-weight: 500; font-size: 0.85rem;
            background: var(--bg-input); color: var(--text-muted); 
            border: 1px solid var(--border-color); cursor: pointer;
            transition: all 0.2s ease; display: flex; align-items: center; gap: 6px;
        }
        .tab-btn.active { background: var(--accent-blue); color: #fff; border-color: var(--accent-blue); }
        .theme-toggle-btn:hover, .tab-btn:hover { border-color: var(--accent-blue); color: var(--text-main); }

        /* Cards / Panels */
        .card { 
            background: var(--bg-panel); border: 1px solid var(--border-color); 
            padding: 1.5rem; margin-bottom: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .card h2 { font-size: 1rem; font-weight: 600; margin-top: 0; margin-bottom: 1rem; color: var(--text-main); }

        .grid-filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 1rem; }
        
        label { display: block; font-size: 0.75rem; font-weight: 500; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em; }
        
        input, select, button {
            padding: 10px 12px; border: 1px solid var(--border-color);
            background: var(--bg-input); color: var(--text-main); font-size: 0.9rem;
            outline: none; transition: border-color 0.2s;
        }
        input:focus, select:focus { border-color: var(--accent-blue); }

        button { background: var(--accent-blue); color: #fff; cursor: pointer; border: none; font-weight: 600; }
        button:hover { background: var(--accent-hover); }
        button:disabled { background: var(--border-color); color: var(--text-muted); cursor: not-allowed; }

        .hidden { display: none; }
        .supported-badge { display: inline-block; background: var(--bg-input); border: 1px solid var(--border-color); padding: 3px 8px; font-size: 0.75rem; color: var(--text-muted); margin-right: 4px; }
        #status { text-align: center; font-size: 0.85rem; color: var(--text-muted); margin-top: 10px; }

        /* Search Grid & Video Cards */
        .results-list { display: flex; flex-direction: column; gap: 1rem; }
        .grid-results { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1rem; }
        
        .video-card { background: var(--bg-input); overflow: hidden; border: 1px solid var(--border-color); display: flex; flex-direction: column; }
        .video-card img { width: 100%; height: 140px; object-fit: cover; border-bottom: 1px solid var(--border-color); }
        .video-card-body { padding: 12px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .badge { background: var(--accent-success); color: #fff; padding: 2px 6px; font-size: 0.7rem; font-weight: 600; }

        /* Interactive Video Preview Card (Matches reference design) */
        .video-preview-card {
            background: var(--bg-panel);
            border: 2px solid var(--accent-success);
            display: flex;
            gap: 16px;
            padding: 16px;
            margin-bottom: 1rem;
            align-items: center;
        }
        .video-preview-thumb {
            width: 200px;
            height: 115px;
            object-fit: cover;
            border: 1px solid var(--border-color);
            flex-shrink: 0;
        }
        .download-action-group {
            display: flex;
            align-items: center;
            gap: 0;
            margin-top: 12px;
        }
        .btn-download-main {
            background: var(--accent-success);
            color: #fff;
            padding: 10px 20px;
            font-weight: 600;
            border: none;
            cursor: pointer;
        }
        .btn-download-main:hover { opacity: 0.9; }
        .select-res-dropdown {
            background: var(--bg-input);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-left: none;
            padding: 10px 14px;
            font-weight: 600;
            cursor: pointer;
            outline: none;
        }

        /* Tracklist Checklist with Covers */
        .track-item {
            display: flex; align-items: center; justify-content: space-between;
            background: var(--bg-input); border: 1px solid var(--border-color);
            padding: 8px 12px; margin-bottom: 8px; font-size: 0.85rem;
        }
        .track-info { display: flex; align-items: center; gap: 12px; overflow: hidden; }
        .track-thumb { width: 40px; height: 40px; object-fit: cover; background: var(--border-color); flex-shrink: 0; border: 1px solid var(--border-color); }
        .track-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-main); font-weight: 500; }

        .cc-checkbox { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; margin-top: 5px; cursor: pointer; text-transform: none; color: var(--text-main); }
        .cc-checkbox input { width: auto; cursor: pointer; }
    </style>
</head>
<body data-theme="dark">

<div class="container">
    <!-- Workspace Top Navigation Header -->
    <div class="workspace-header">
        <h1>
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            Media Workspace
        </h1>
        <div class="header-actions">
            <div class="nav-tabs">
                <button class="tab-btn active" onclick="switchTab('universal-tab', this)">
                    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                    Universal
                </button>
                <button class="tab-btn" onclick="switchTab('video-tab', this)">
                    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="0" ry="0"/></svg>
                    YouTube 8K
                </button>
                <button class="tab-btn" onclick="switchTab('music-tab', this)">
                    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
                    Music & Playlists
                </button>
            </div>
            <button class="theme-toggle-btn" onclick="toggleTheme()" title="Toggle Dark/Light Mode">
                <svg id="theme-icon" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                Theme
            </button>
        </div>
    </div>

    <!-- TAB 1: Universal Downloader -->
    <div id="universal-tab" class="tab-content">
        <div class="card">
            <h2>Multi-Platform Downloader</h2>
            <div style="margin-bottom: 12px;">
                <span class="supported-badge">TikTok</span>
                <span class="supported-badge">Instagram</span>
                <span class="supported-badge">X / Twitter</span>
                <span class="supported-badge">YouTube</span>
                <span class="supported-badge">+1000 Sites</span>
            </div>

            <div style="margin-bottom: 1rem;">
                <label>Media Link</label>
                <input type="text" id="uni-url" placeholder="Paste media URL here..." style="width: 100%;">
            </div>

            <div class="grid-filters">
                <div>
                    <label>Mode</label>
                    <select id="uni-mode">
                        <option value="video" selected>Video + Audio (MP4)</option>
                        <option value="audio_only">Audio Only (MP3)</option>
                    </select>
                </div>
                <div>
                    <label>Start Clip (Optional)</label>
                    <input type="text" id="uni-start" placeholder="e.g. 00:10">
                </div>
                <div>
                    <label>End Clip (Optional)</label>
                    <input type="text" id="uni-end" placeholder="e.g. 01:30">
                </div>
            </div>

            <div class="grid-filters" style="align-items: center;">
                <div>
                    <label class="cc-checkbox">
                        <input type="checkbox" id="uni-embed-cc"> Embed Subtitles / CC
                    </label>
                </div>
                <div>
                    <label>Language</label>
                    <select id="uni-cc-lang">
                        <option value="en" selected>English</option>
                        <option value="es">Spanish</option>
                        <option value="fr">French</option>
                        <option value="all">All Available</option>
                    </select>
                </div>
            </div>

            <button id="uni-btn" onclick="downloadUniversal()" style="width: 100%; margin-top: 8px;">Process Download</button>
        </div>

        <div id="uni-result" class="card hidden" style="text-align: center;">
            <h3 id="uni-title" style="margin-top:0; font-size: 1rem;"></h3>
            <p id="uni-site" style="color: var(--accent-success); font-weight: 600; font-size: 0.85rem;"></p>
            <a id="uni-link" href="" download><button style="width:100%;">Save to Device</button></a>
        </div>
    </div>

    <!-- TAB 2: YouTube Search & 8K Video -->
    <div id="video-tab" class="tab-content hidden">
        <div class="card">
            <h2>YouTube Video Explorer</h2>
            <div style="display: flex; gap: 8px; margin-bottom: 1rem;">
                <input type="text" id="search-query" placeholder="Search query or YouTube URL..." style="flex: 1;">
                <button onclick="executeSearch()">Search</button>
            </div>
            <div class="grid-filters">
                <div>
                    <label>Sort By</label>
                    <select id="filter-sort">
                        <option value="relevance">Relevance</option>
                        <option value="date">Upload Date</option>
                        <option value="views">View Count</option>
                    </select>
                </div>
                <div>
                    <label>Min. Quality</label>
                    <select id="filter-res">
                        <option value="0">Any Quality</option>
                        <option value="1080">1080p FHD</option>
                        <option value="2160">4K Ultra HD</option>
                        <option value="4320">8K Ultra HD</option>
                    </select>
                </div>
            </div>

            <div class="grid-filters" style="align-items: center;">
                <div>
                    <label class="cc-checkbox">
                        <input type="checkbox" id="yt-embed-cc" checked> Embed CC Subtitles
                    </label>
                </div>
                <div>
                    <label>CC Language</label>
                    <select id="yt-cc-lang">
                        <option value="en" selected>English</option>
                        <option value="es">Spanish</option>
                        <option value="fr">French</option>
                        <option value="all">All Available</option>
                    </select>
                </div>
            </div>
        </div>
        <div id="results" class="results-list"></div>
    </div>

    <!-- TAB 3: Music & Playlists -->
    <div id="music-tab" class="tab-content hidden">
        <div class="card">
            <h2>Music & Playlist Workspace</h2>
            <div style="margin-bottom: 1rem;">
                <label>Spotify or YouTube Playlist URL</label>
                <input type="text" id="music-url" placeholder="Paste Spotify or YouTube playlist/track link..." style="width: 100%;">
            </div>
            <div class="grid-filters">
                <div>
                    <label>Audio Format</label>
                    <select id="music-format">
                        <option value="mp3" selected>MP3</option>
                        <option value="flac">FLAC (Lossless)</option>
                        <option value="m4a">M4A (AAC)</option>
                    </select>
                </div>
                <div>
                    <label>Bitrate Quality</label>
                    <select id="music-quality">
                        <option value="320" selected>320 kbps</option>
                        <option value="256">256 kbps</option>
                    </select>
                </div>
            </div>
            <button id="fetch-playlist-btn" onclick="fetchPlaylist()" style="width: 100%;">Extract Tracklist</button>
        </div>

        <!-- Tracklist Selection Container -->
        <div id="tracklist-container" class="hidden card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <h3 style="margin: 0; font-size: 0.95rem;">Select Tracks:</h3>
                <div>
                    <button onclick="toggleSelectAll(true)" style="padding: 4px 10px; font-size: 0.75rem; background: var(--bg-input); border: 1px solid var(--border-color);">Select All</button>
                    <button onclick="toggleSelectAll(false)" style="padding: 4px 10px; font-size: 0.75rem; background: var(--bg-input); border: 1px solid var(--border-color);">Deselect All</button>
                </div>
            </div>
            <div id="tracks-checklist" style="max-height: 280px; overflow-y: auto; padding-right: 4px; margin-bottom: 1rem;"></div>
            <button id="download-selected-btn" onclick="downloadSelectedMusic()" style="width: 100%; background: var(--accent-success);">Download Selected Tracks</button>
        </div>

        <div id="downloaded-music-container" class="hidden card">
            <h3 style="margin-top:0; font-size: 0.95rem;">Downloaded Output Files:</h3>
            <div id="music-file-list"></div>
        </div>
    </div>

    <p id="status"></p>
</div>

<script>
    let fetchedTracks = [];

    function switchTab(tabId, element) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(tabId).classList.remove('hidden');
        element.classList.add('active');
    }

    function toggleTheme() {
        const body = document.body;
        const icon = document.getElementById('theme-icon');
        const currentTheme = body.getAttribute('data-theme');
        
        if (currentTheme === 'dark') {
            body.setAttribute('data-theme', 'light');
            icon.innerHTML = '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
        } else {
            body.setAttribute('data-theme', 'dark');
            icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
        }
    }

    async function downloadUniversal() {
        const url = document.getElementById('uni-url').value;
        const media_type = document.getElementById('uni-mode').value;
        const start_time = document.getElementById('uni-start').value;
        const end_time = document.getElementById('uni-end').value;
        const embed_cc = document.getElementById('uni-embed-cc').checked;
        const cc_lang = document.getElementById('uni-cc-lang').value;
        const status = document.getElementById('status');
        const btn = document.getElementById('uni-btn');
        const resultCard = document.getElementById('uni-result');

        if (!url) return alert('Please enter a media URL.');

        status.innerText = 'Processing extraction & embedding captions...';
        btn.disabled = true;
        resultCard.classList.add('hidden');

        try {
            const response = await fetch('/download-universal', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url, media_type, start_time, end_time, embed_cc, cc_lang })
            });

            const data = await response.json();
            if (!response.ok) throw new Error(data.error);

            status.innerText = 'Ready for download.';
            document.getElementById('uni-title').innerText = data.title;
            document.getElementById('uni-site').innerText = `Source: ${data.site}`;
            document.getElementById('uni-link').href = `/files/universal/${encodeURIComponent(data.filename)}`;
            resultCard.classList.remove('hidden');
        } catch (err) {
            status.innerText = 'Failed: ' + err.message;
        } finally {
            btn.disabled = false;
        }
    }

    async function executeSearch() {
        const query = document.getElementById('search-query').value;
        const sort_by = document.getElementById('filter-sort').value;
        const min_res = document.getElementById('filter-res').value;
        const status = document.getElementById('status');
        const resultsContainer = document.getElementById('results');

        if (!query) return alert('Enter a search query.');

        status.innerText = 'Searching workspace & analyzing stream resolutions...';
        resultsContainer.innerHTML = '';

        try {
            const response = await fetch('/search', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query, sort_by, min_res, limit: 10 })
            });

            const data = await response.json();
            if (!response.ok) throw new Error(data.error);

            status.innerText = `Found ${data.results.length} result(s):`;

            // Create container grid for video cards
            const gridDiv = document.createElement('div');
            gridDiv.className = 'grid-results';

            data.results.forEach(v => {
                const item = document.createElement('div');
                item.className = 'video-card';
                item.innerHTML = `
                    <img src="${v.thumbnail}" alt="thumb">
                    <div class="video-card-body">
                        <div>
                            <span class="badge">${v.max_resolution}</span>
                            <p style="font-weight:600; margin: 8px 0 4px 0; font-size: 0.85rem; color:var(--text-main);">${v.title}</p>
                            <p style="font-size: 0.75rem; color: var(--text-muted); margin: 0;">${v.uploader} • ${v.duration || 'N/A'}</p>
                        </div>
                        <button onclick='showVideoPreview(${JSON.stringify(v)})' style="margin-top: 10px; width: 100%; font-size:0.8rem;">
                            Select & Download
                        </button>
                    </div>
                `;
                gridDiv.appendChild(item);
            });
            resultsContainer.appendChild(gridDiv);
        } catch (err) {
            status.innerText = 'Search failed: ' + err.message;
        }
    }

    // Displays the preview box matching your reference image above the results
    function showVideoPreview(v) {
        const resultsContainer = document.getElementById('results');
        
        // Remove existing preview if present
        const existingPreview = document.getElementById('active-video-preview');
        if (existingPreview) existingPreview.remove();

        const maxHeight = v.max_height || 1080;
        
        // Build dynamic resolution options based on actual detected max height
        let optionsHTML = '';
        const standardRes = [4320, 2160, 1080, 720, 480, 360];
        standardRes.forEach(res => {
            if (maxHeight >= res || res === 720 || res === 360) {
                let label = res === 2160 ? '4K UHD' : (res === 4320 ? '8K UHD' : `${res}p`);
                let selected = (res === 1080 || (maxHeight < 1080 && res === maxHeight)) ? 'selected' : '';
                optionsHTML += `<option value="${res}" ${selected}>MP4 ${label}</option>`;
            }
        });

        const previewDiv = document.createElement('div');
        previewDiv.id = 'active-video-preview';
        previewDiv.className = 'video-preview-card';
        previewDiv.innerHTML = `
            <img src="${v.thumbnail}" class="video-preview-thumb" alt="thumb">
            <div style="flex: 1; overflow: hidden;">
                <h3 style="margin: 0 0 6px 0; font-size: 0.95rem; color: var(--text-main); text-overflow: ellipsis; white-space: nowrap; overflow: hidden;">${v.title}</h3>
                <p style="margin: 0 0 12px 0; font-size: 0.8rem; color: var(--text-muted);">${v.duration} • Highest Detected: ${v.max_resolution}</p>
                <div class="download-action-group">
                    <button class="btn-download-main" onclick="downloadSelectedVideo('${v.url}')">Download</button>
                    <select id="preview-res-select" class="select-res-dropdown">
                        ${optionsHTML}
                    </select>
                </div>
            </div>
        `;

        resultsContainer.prepend(previewDiv);
        previewDiv.scrollIntoView({ behavior: 'smooth' });
    }

    async function downloadSelectedVideo(url) {
        const status = document.getElementById('status');
        const resSelect = document.getElementById('preview-res-select');
        const chosenRes = resSelect ? resSelect.value : "1080";
        const embed_cc = document.getElementById('yt-embed-cc') ? document.getElementById('yt-embed-cc').checked : false;
        const cc_lang = document.getElementById('yt-cc-lang') ? document.getElementById('yt-cc-lang').value : 'en';

        status.innerText = `Preparing ${chosenRes}p download...`;

        try {
            const response = await fetch('/download', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url, resolution: chosenRes, embed_cc, cc_lang })
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error);
            window.location.href = `/files/${encodeURIComponent(data.filename)}`;
            status.innerText = 'Download complete!';
        } catch (err) {
            status.innerText = 'Download failed: ' + err.message;
        }
    }

    async function fetchPlaylist() {
        const url = document.getElementById('music-url').value;
        const status = document.getElementById('status');
        const btn = document.getElementById('fetch-playlist-btn');
        const tracklistContainer = document.getElementById('tracklist-container');
        const checklist = document.getElementById('tracks-checklist');

        if (!url) return alert('Please enter a music or playlist URL');

        status.innerText = 'Extracting tracklist & album art...';
        btn.disabled = true;
        tracklistContainer.classList.add('hidden');
        checklist.innerHTML = '';

        try {
            const response = await fetch('/fetch-playlist', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url })
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error);

            fetchedTracks = data.tracks;
            status.innerText = `Loaded ${fetchedTracks.length} track(s).`;

            fetchedTracks.forEach((track, index) => {
                const row = document.createElement('div');
                row.className = 'track-item';
                const thumbUrl = track.thumbnail || 'https://via.placeholder.com/40?text=♪';
                row.innerHTML = `
                    <div class="track-info">
                        <input type="checkbox" id="track-${index}" checked style="cursor: pointer;">
                        <img src="${thumbUrl}" class="track-thumb" alt="cover">
                        <span class="track-title" title="${track.title}">${track.title}</span>
                    </div>
                `;
                checklist.appendChild(row);
            });

            tracklistContainer.classList.remove('hidden');
        } catch (err) {
            status.innerText = 'Failed to load tracklist: ' + err.message;
        } finally {
            btn.disabled = false;
        }
    }

    function toggleSelectAll(selectState) {
        fetchedTracks.forEach((_, index) => {
            const checkbox = document.getElementById(`track-${index}`);
            if (checkbox) checkbox.checked = selectState;
        });
    }

    async function downloadSelectedMusic() {
        const format = document.getElementById('music-format').value;
        const quality = document.getElementById('music-quality').value;
        const status = document.getElementById('status');
        const btn = document.getElementById('download-selected-btn');
        const fileList = document.getElementById('music-file-list');

        const selectedTracks = [];
        fetchedTracks.forEach((track, index) => {
            const checkbox = document.getElementById(`track-${index}`);
            if (checkbox && checkbox.checked) {
                selectedTracks.push(track);
            }
        });

        if (selectedTracks.length === 0) return alert('Please select at least one track.');

        status.innerText = `Downloading ${selectedTracks.length} track(s)...`;
        btn.disabled = true;

        try {
            const response = await fetch('/download-music', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tracks: selectedTracks, format, quality })
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error);

            status.innerText = data.message;
            document.getElementById('downloaded-music-container').classList.remove('hidden');
            fileList.innerHTML = '';
            
            data.files.forEach((filename, i) => {
                const fileUrl = `/files/music/${encodeURIComponent(filename)}`;
                fileList.innerHTML += `<p style="margin: 4px 0;"><a href="${fileUrl}" download style="color:var(--accent-blue); text-decoration: none; font-weight: 500;">${filename}</a></p>`;
                
                setTimeout(() => {
                    const a = document.createElement('a');
                    a.href = fileUrl;
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                }, i * 350);
            });
        } catch (err) {
            status.innerText = 'Download failed: ' + err.message;
        } finally {
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
